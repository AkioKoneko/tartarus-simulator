[package]
name = "tartarus-core"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[features]
default = []
solver = []
[[bin]]
name = "tartarus-core-cli"
path = "src/main.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
