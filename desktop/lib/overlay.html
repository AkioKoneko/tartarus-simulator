<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:">
<title>Tartarus Overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Big+Shoulders+Stencil+Display:wght@800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* The site's colors (css/style.css), for a card over the game. */
  :root {
    --stone: #0f1216;
    --slab: #171b21;
    --slab-hi: #1f242c;
    --iron: #353c47;
    --iron-hi: #545e6d;
    --chalk: #e3e6eb;
    --ash: #959dab;
    --bone: #eadfc5;
    --blood: #e0675f;
    --moss: #86c497;
    --teal: #5fc4b8;
    --check: #f1cd48;
    --font-display: "Big Shoulders Stencil Display", "Arial Narrow", Impact, sans-serif;
    --font-body: "Barlow Semi Condensed", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --radius: 6px;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }

  body {
    color: var(--chalk);
    font: 14px/1.35 var(--font-body);
  }

  .card {
    margin: 0;
    border: 1px solid color-mix(in srgb, var(--teal) 40%, var(--iron));
    border-radius: var(--radius);
    background: color-mix(in srgb, var(--stone) 92%, transparent);
    overflow: hidden;
  }

  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px 5px 10px;
    border-bottom: 1px solid var(--iron);
    background: color-mix(in srgb, var(--slab) 90%, transparent);
    -webkit-app-region: drag;
    cursor: move;
  }

  .brand {
    color: var(--teal);
    font: 800 15px/1 var(--font-display);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .day {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    color: var(--ash);
    font: 500 11.5px/1.2 var(--font-mono);
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .head button {
    -webkit-app-region: no-drag;
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--ash);
    font: 600 14px/1 var(--font-body);
    cursor: pointer;
  }

  .head button:hover {
    background: var(--slab-hi);
    color: var(--bone);
  }

  .head button[aria-pressed="true"] {
    color: var(--check);
  }

  .body {
    padding: 8px 10px 9px;
  }

  .eyebrow {
    margin: 0 0 2px;
    color: var(--teal);
    font: 500 10.5px/1.2 var(--font-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .move {
    margin: 0 0 4px;
    color: var(--bone);
    font: 700 21px/1.15 var(--font-body);
    text-wrap: balance;
  }

  .why {
    margin: 0 0 4px;
    color: var(--chalk);
    font-size: 13.5px;
  }

  .meta {
    margin: 0;
    color: var(--ash);
    font: 400 11.5px/1.4 var(--font-mono);
  }

  .alt {
    margin: 4px 0 0;
    color: var(--ash);
    font-size: 12.5px;
  }

  .line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 6px;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
  }

  .line p {
    flex: 1;
    margin: 0;
  }

  .line.is-warn {
    border: 1px solid color-mix(in srgb, var(--check) 50%, transparent);
    background: color-mix(in srgb, var(--check) 10%, transparent);
    color: var(--check);
  }

  .line.is-bad {
    border: 1px solid color-mix(in srgb, var(--blood) 55%, transparent);
    background: color-mix(in srgb, var(--blood) 12%, transparent);
    color: #f3a49e;
  }

  .line.is-info {
    border: 1px solid var(--iron);
    background: var(--slab);
    color: var(--chalk);
  }

  .advice-risk {
    min-width: 0;
    margin: 0 0 8px;
    padding: 7px 8px;
    border: 1px solid color-mix(in srgb, var(--check) 50%, var(--iron));
    border-radius: 4px;
    background: color-mix(in srgb, var(--check) 7%, var(--slab));
    overflow-wrap: anywhere;
  }
  .risk-title { margin: 0 0 3px; color: var(--check); font-size: 13px; font-weight: 700; }
  .risk-message { margin: 0; color: var(--chalk); font-size: 12.5px; line-height: 1.35; }
  .risk-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; min-width: 0; }
  .risk-actions button.btn { min-width: 0; max-width: 100%; white-space: normal; overflow-wrap: anywhere; font-size: 12px; }
  .risk-actions button.btn[aria-pressed="true"] { border-color: var(--check); background: color-mix(in srgb, var(--check) 12%, var(--slab)); }
  .risk-actions button.btn.is-primary { border-color: var(--teal); background: color-mix(in srgb, var(--teal) 22%, var(--slab)); }

  .hints-status {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px 8px;
    margin: 0;
    padding: 6px 0 0;
    border-top: 1px solid var(--iron);
    color: var(--ash);
    font-size: 12.5px;
  }

  .hints-status p { flex: 1 1 190px; min-width: 0; margin: 0; overflow-wrap: anywhere; }
  .hints-status-label { color: var(--bone); font-weight: 600; }
  .hints-status[data-state="active"] p { color: var(--chalk); }
  .hints-status button.btn { flex: none; font-size: 12px; }
  #hints-status-area { width:100%; }
  #hints-status-area:empty { display:none; }
  .instruments-status { width:100%; margin:0; padding-top:6px; border-top:1px solid var(--iron); color:var(--ash); font-size:12px; line-height:1.4; overflow-wrap:anywhere; }
  .instruments-status[data-state="pending"] { color:var(--check); }

  .spin {
    flex: none;
    width: 12px;
    height: 12px;
    border: 2px solid var(--iron-hi);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .is-stale .move,
  .is-stale .why {
    opacity: 0.55;
  }

  .foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 6px 10px 8px;
    border-top: 1px solid var(--iron);
  }

  button.btn {
    padding: 3px 9px;
    border: 1px solid var(--iron-hi);
    border-radius: 4px;
    background: var(--slab-hi);
    color: var(--chalk);
    font: 600 12.5px/1.3 var(--font-body);
    cursor: pointer;
  }

  button.btn:hover {
    border-color: var(--teal);
    color: var(--bone);
  }

  button.btn.is-primary {
    border-color: var(--teal);
    background: color-mix(in srgb, var(--teal) 22%, var(--slab));
  }

  .line button.btn {
    flex: none;
  }

  .dots {
    display: flex;
    gap: 8px;
    margin-left: auto;
    color: var(--ash);
    font: 400 11px/1 var(--font-mono);
  }

  .dot::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 4px;
    border-radius: 50%;
    background: var(--check);
    vertical-align: 0;
  }

  .dot.is-on::before {
    background: var(--moss);
  }

  .dot.is-off::before {
    background: var(--blood);
  }

  .menu {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    width: 100%;
  }

  [hidden] {
    display: none !important;
  }

  button:focus-visible { outline: 2px solid var(--bone); outline-offset: -3px; }
  .orb {
    display: none;
    width: 56px;
    height: 56px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    box-shadow: none;
    color: #e8eaed;
    cursor: pointer;
    touch-action: none;
    -webkit-app-region: no-drag;
    opacity: 1;
    transition: color 140ms, opacity 700ms ease;
  }
  .orb.is-idle { opacity: .5; }
  .orb:hover, .orb:focus-visible, .orb.is-dragging { opacity: 1; }
  .orb:hover { color: #fff; }
  .orb.is-dragging { cursor: grabbing; }
  .orb svg { width: 42px; height: 42px; pointer-events: none; filter: drop-shadow(0 1px 1px #000); transition: filter 140ms; }
  .orb:hover svg { filter: drop-shadow(0 0 3px #e3e6eb66) drop-shadow(0 1px 1px #000); }
  .is-collapsed .card { width: 56px; height: 56px; border: 0; background: transparent; border-radius: 0; }
  .is-collapsed .head, .is-collapsed .body, .is-collapsed .foot { display: none; }
  .is-collapsed .orb { display: grid; place-items: center; }
  .plan { margin: 0; }
  .plan ol { margin: 7px 0 0; padding: 0; list-style: none; }
  .plan li { display:flex; gap:9px; padding:8px 8px 8px 0; border-left:2px solid var(--iron); color:var(--ash); }
  .plan li + li { border-top:1px solid var(--iron); }
  .plan li[data-state="current"] { padding-left:8px; border-left-color:var(--teal); background:color-mix(in srgb,var(--teal) 8%,transparent); color:var(--bone); }
  .step-number { flex:none; width:25px; padding-top:2px; text-align:center; font:600 12px/1.4 var(--font-mono); color:var(--ash); }
  .plan li[data-state="current"] .step-number, .plan li[data-state="current"] .step-stage { color:var(--teal); }
  .step-copy { min-width:0; flex:1; }
  .step-stage { display:block; margin-bottom:3px; color:var(--ash); font-size:10.5px; line-height:1.3; letter-spacing:.04em; }
  .step-label { margin:0; font-size:13px; line-height:1.4; overflow-wrap:anywhere; }
  .plan .move { margin:0; font-size:16px; }
  .advice-details { margin-top:9px; padding-top:7px; border-top:1px solid var(--iron); color:var(--ash); }
  .advice-details summary { cursor:pointer; font-size:12px; }
  .advice-details summary:focus-visible { outline:2px solid var(--bone); outline-offset:2px; }
  .plan-note { margin: 6px 0 0; color: var(--ash); font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } .orb, .orb svg { transition: none; } }
</style>
</head>
<body>
<div class="card" id="card">
  <button type="button" class="orb" id="orb" aria-label="Expand Tartarus advice" aria-expanded="false" title="Expand Tartarus advice · drag to move">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 8h18l-2 5h-5v13h-4V13H9L7 8Z" fill="currentColor"/><path d="m5 5 3 3M27 5l-3 3M10 27h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <div class="head">
    <span class="brand">Tartarus</span>
    <span class="day" id="day"></span>
    <button type="button" id="fold" aria-label="Collapse Tartarus advice to an icon" aria-expanded="true" title="Collapse to an icon">&#8211;</button>
  </div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot">
    <button type="button" class="btn" data-cmd="board" title="Show or hide the board analyzer (Ctrl+Alt+A)">Board</button>
    <button type="button" class="btn" data-cmd="capture" title="Take a picture of the game now and read it (Ctrl+Alt+P)">Picture</button>
    <button type="button" class="btn" id="report" title="Mark wrong advice, report a wrong reading, or something the simulator doesn't have">Report</button>
    <span class="dots"><span class="dot" id="dot-log">Log</span><span class="dot" id="dot-win">Window</span></span>
    <div class="menu" id="report-menu" hidden>
      <button type="button" class="btn" data-cmd="report-advice" id="report-advice" title="Save this advice and its recorded picture for review">Wrong advice</button>
      <button type="button" class="btn" data-cmd="report" id="report-reading">Wrong reading</button>
      <button type="button" class="btn" data-cmd="report-new">Something new</button>
      <button type="button" class="btn" data-cmd="debug-report" title="Something isn't working: sends the app's debug report">Not working?</button>
    </div>
    <p id="advice-report-status" class="instruments-status" role="status" hidden></p>
    <div id="hints-status-area"></div>
    <p id="instruments-status" class="instruments-status" role="status" title="Instruments currently used for advice. Correct them in Board.">Instruments: waiting for the board.</p>
  </div>
</div>
<script src="overlay.js"></script>
</body>
</html>
