name: Enhanced overlay checks

on:
  push:
    branches: [enhanced-overlay]
  pull_request:
    branches: [enhanced-overlay]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tools/check-enhanced.js
      - run: git diff --check
